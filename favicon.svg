<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Living Window">
  <title>The Living Window</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dcb4"/>
      <stop offset="1" stop-color="#e0b273"/>
    </linearGradient>
    <clipPath id="pane">
      <rect x="6" y="5" width="20" height="22" rx="2"/>
    </clipPath>
  </defs>
  <!-- the room, in dusk ink -->
  <rect width="32" height="32" rx="7" fill="#14110e"/>
  <!-- the land seen through the opening: sky, a far ridge, the near ground -->
  <g clip-path="url(#pane)">
    <rect x="6" y="5" width="20" height="22" fill="url(#sky)"/>
    <path d="M6 21c3.4-4.4 6.2-4.4 9 -1.2s5.6 2.6 11 -2.4V27H6z" fill="#7a6845"/>
    <path d="M6 24.4c4.6-1.8 8-1.6 10.4.4s6.6 1.2 9.6-1.2V27H6z" fill="#33291c"/>
    <!-- one bird, held wide enough to read at any size -->
    <path d="M16 11.9c-1.5-2.4-3.6-2.9-5.6-1.9 1.9.1 3.4 1.1 4.4 2.9h2.4c1-1.8 2.5-2.8 4.4-2.9-2-1-4.1-.5-5.6 1.9z"
      fill="#241d15"/>
  </g>
  <!-- the casement frame -->
  <rect x="6" y="5" width="20" height="22" rx="2" fill="none"
    stroke="#d4a574" stroke-width="2.4"/>
</svg>
