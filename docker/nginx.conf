# Living Window static site. Everything runs in the browser, so this only
# serves files: long-lived caching for fingerprinted assets, fresh copies
# of the page and the audio manifest, and gzip for text.
server {
    # IPv4 only by default: an IPv6 listener stops nginx starting on hosts
    # (or Docker networks) without IPv6. Add `listen [::]:8080;` if you need it.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Note: a `types { }` block here would *replace* nginx's whole MIME table
    # (serving scripts as octet-stream, which nosniff then blocks), so the
    # web app manifest gets its type in its own location below instead.

    # Media can come from anywhere the listener points the radio at.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src * data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fingerprinted bundles never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Your own recordings: cache for a day, but always re-check the manifest.
    location = /audio/manifest.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /audio/ {
        expires 1d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # The page itself is always revalidated so updates show up at once.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src * data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
        try_files $uri $uri/ /index.html;
    }
}
